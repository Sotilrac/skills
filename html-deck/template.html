<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deck title</title>
<script src="deck-stage.js"></script>
<style>
  html, body { margin: 0; background: #050810; }

  .slide {
    font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif;
    color: #f5f5f5;
    background: #0E1420;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding: 96px 120px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  h1 { font-size: 160px; font-weight: 300; letter-spacing: -0.03em; margin: 0; text-wrap: balance; }
  h2 { font-size: 72px;  font-weight: 300; letter-spacing: -0.015em; margin: 0 0 32px 0; text-wrap: balance; }
  p  { font-size: 32px;  line-height: 1.4; margin: 0; max-width: 1400px; color: #c9c5b6; font-weight: 300; }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: #F2C24B;
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 28px;
  }

  .accent { color: #F2C24B; }
</style>
</head>
<body>
<deck-stage width="1920" height="1080">

  <section data-label="01 Cover" class="slide">
    <div class="eyebrow">Draft</div>
    <h1>Title of <span class="accent">the deck</span>.</h1>
    <p style="margin-top: 48px;">One-line subtitle that frames the argument.</p>
  </section>

  <section data-label="02 Intro" class="slide">
    <h2>Why this, why now.</h2>
    <p>Body of the argument. Keep it to a sentence or two. Save the detail for a follow-up slide.</p>
  </section>

  <section data-label="03 Close" class="slide">
    <h2>The ask.</h2>
    <p>What do you want the audience to do next? Name the owner and the date.</p>
  </section>

</deck-stage>

<script type="application/json" id="speaker-notes">
[
  { "title": "Cover",  "notes": "Open with the frame. One-sentence pitch." },
  { "title": "Intro",  "notes": "Land the why-now beat before going into details." },
  { "title": "Close",  "notes": "Make the ask explicit. Name the owner and the date." }
]
</script>
</body>
</html>
